<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice AI Agent — Learning Notes</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161922;
    --panel-2: #1c202b;
    --border: #2a2f3d;
    --text: #e6e8ee;
    --muted: #9aa2b1;
    --accent: #6ea8fe;
    --accent-2: #7ee7c7;
    --code-bg: #10131a;
    --tag-phase: #3a5a9b;
    --tag-qa: #3a7d63;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  /* Sidebar */
  #sidebar {
    width: 300px;
    min-width: 240px;
    max-width: 420px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    resize: horizontal;
    overflow: hidden;
  }
  #sidebar-header {
    padding: 16px 16px 8px;
    border-bottom: 1px solid var(--border);
  }
  #sidebar-header h1 {
    font-size: 15px;
    margin: 0 0 10px;
    color: var(--accent);
    letter-spacing: 0.3px;
  }
  #search {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  #search:focus { border-color: var(--accent); }
  .filter-row {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .filter-btn {
    flex: 1;
    padding: 5px 6px;
    font-size: 11px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--muted);
    cursor: pointer;
  }
  .filter-btn.active {
    background: var(--accent);
    color: #0b0d12;
    border-color: var(--accent);
    font-weight: 600;
  }
  #nav-list {
    overflow-y: auto;
    flex: 1;
    padding: 8px 0;
  }
  .nav-item {
    padding: 10px 16px;
    cursor: pointer;
    border-left: 3px solid transparent;
    font-size: 13px;
    color: var(--muted);
  }
  .nav-item:hover { background: var(--panel-2); color: var(--text); }
  .nav-item.active {
    background: var(--panel-2);
    border-left-color: var(--accent);
    color: var(--text);
  }
  .nav-item .title {
    display: block;
    margin-bottom: 4px;
    font-weight: 500;
    line-height: 1.3;
  }
  .tag {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 10px;
    margin-right: 6px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .tag.phase { background: var(--tag-phase); color: #dce6ff; }
  .tag.qa { background: var(--tag-qa); color: #dcfff0; }
  #sidebar-footer {
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
  }

  /* Main content */
  #main {
    flex: 1;
    overflow-y: auto;
    padding: 40px 60px 80px;
  }
  #main .empty {
    color: var(--muted);
    font-size: 14px;
    margin-top: 40px;
  }
  .entry { max-width: 860px; }
  .entry .meta {
    margin-bottom: 6px;
  }
  .entry h2 {
    font-size: 24px;
    margin: 4px 0 18px;
    color: var(--text);
  }
  .entry .date {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 20px;
  }
  .entry h3 {
    font-size: 16px;
    color: var(--accent-2);
    margin: 26px 0 8px;
  }
  .entry p, .entry li { line-height: 1.7; font-size: 14.5px; color: var(--text); }
  .entry ul, .entry ol { padding-left: 22px; }
  .entry code {
    background: var(--code-bg);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 13px;
    color: var(--accent-2);
  }
  .entry pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
  }
  .entry pre code {
    background: none;
    border: none;
    padding: 0;
    color: var(--text);
  }
  .entry table {
    border-collapse: collapse;
    width: 100%;
    margin: 12px 0;
    font-size: 13.5px;
  }
  .entry th, .entry td {
    border: 1px solid var(--border);
    padding: 8px 10px;
    text-align: left;
  }
  .entry th { background: var(--panel-2); color: var(--accent); }
  .entry blockquote {
    border-left: 3px solid var(--accent);
    margin: 12px 0;
    padding: 4px 14px;
    color: var(--muted);
    font-style: italic;
  }
  #main::-webkit-scrollbar, #nav-list::-webkit-scrollbar { width: 8px; }
  #main::-webkit-scrollbar-thumb, #nav-list::-webkit-scrollbar-thumb {
    background: var(--border); border-radius: 4px;
  }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>🎙 Voice AI Agent — Notes</h1>
    <input id="search" type="text" placeholder="Search notes...">
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="phase">Phase Notes</button>
      <button class="filter-btn" data-filter="qa">Q&amp;A</button>
    </div>
  </div>
  <div id="nav-list"></div>
  <div id="sidebar-footer">
    <span id="entry-count"></span> entries · updated as we build
  </div>
</div>

<div id="main">
  <div class="empty">Select an entry from the sidebar to view it.</div>
</div>

<script>
/*
  ENTRIES DATA
  ------------
  type: "phase" | "qa"
  id: unique string, used for anchoring
  title: shown in sidebar
  date: display date
  html: full body HTML rendered in main panel

  To add a new entry: append an object to the ENTRIES array below.
*/
const ENTRIES = [
  {
    id: "qa-stt-tts-models",
    type: "qa",
    title: "What are STT and TTS models? Popular options today?",
    date: "2026-09-12",
    html: `
      <h2>Q&amp;A: What is STT and TTS, and what models are popular right now?</h2>
      <h3>STT — Speech-to-Text (a.k.a. ASR, Automatic Speech Recognition)</h3>
      <p>Takes raw audio (a waveform of someone talking) and converts it into text.
      Internally: audio → spectrogram/features → an acoustic+language model (usually
      a single end-to-end neural network today) → decoded text tokens.</p>

      <h3>TTS — Text-to-Speech</h3>
      <p>The reverse: takes text and synthesizes an audio waveform of a voice speaking
      it. Modern TTS is also end-to-end neural (text → phonemes/tokens → mel-spectrogram
      or latent → vocoder → waveform).</p>

      <h3>Popular STT models/providers (2026)</h3>
      <table>
        <tr><th>Model / Service</th><th>Type</th><th>Notes</th></tr>
        <tr><td><b>OpenAI Whisper</b> (large-v3, etc.)</td><td>Local, open weights</td>
            <td>Most popular open ASR model; robust multilingual, but batch-style, not natively streaming</td></tr>
        <tr><td><b>faster-whisper</b></td><td>Local</td>
            <td>CTranslate2 reimplementation of Whisper — much faster/lower memory, same weights, our Phase 2 pick</td></tr>
        <tr><td><b>whisper.cpp</b></td><td>Local</td>
            <td>C/C++ port, great for CPU/edge/Apple Silicon, powers many local apps</td></tr>
        <tr><td><b>Distil-Whisper</b></td><td>Local</td>
            <td>Distilled/smaller Whisper variants, faster with small accuracy trade-off</td></tr>
        <tr><td><b>NVIDIA Parakeet / Canary</b></td><td>Local (GPU)</td>
            <td>Newer, very fast + accurate on NVIDIA GPUs, growing popularity in 2025-26</td></tr>
        <tr><td><b>Deepgram (Nova-3 / Nova-2)</b></td><td>Managed / cloud, streaming</td>
            <td>Industry-favorite low-latency streaming ASR API; strong for real-time agents</td></tr>
        <tr><td><b>AssemblyAI</b></td><td>Managed / cloud</td>
            <td>Popular alternative to Deepgram, also does diarization/summarization</td></tr>
        <tr><td><b>Google Speech-to-Text / Azure Speech</b></td><td>Managed / cloud</td>
            <td>Enterprise-grade, deep integration with their cloud ecosystems</td></tr>
        <tr><td><b>OpenAI Realtime API (gpt-4o-transcribe)</b></td><td>Managed / cloud, streaming</td>
            <td>Combines ASR + LLM in one realtime socket</td></tr>
      </table>
      <p><b>Our plan:</b> start with <code>faster-whisper</code> locally (Phase 2), later compare
      against <code>Deepgram</code> streaming ASR (Phase 12) once we understand streaming fundamentals.</p>

      <h3>Popular TTS models/providers (2026)</h3>
      <table>
        <tr><th>Model / Service</th><th>Type</th><th>Notes</th></tr>
        <tr><td><b>Piper</b></td><td>Local</td>
            <td>Lightweight, fast, good quality, runs well on CPU — our Phase 4 pick</td></tr>
        <tr><td><b>Coqui XTTS-v2</b></td><td>Local</td>
            <td>High quality, voice cloning support, heavier/slower than Piper</td></tr>
        <tr><td><b>Kokoro TTS</b></td><td>Local</td>
            <td>Small, fast, surprisingly high quality — popular 2025 open release</td></tr>
        <tr><td><b>Bark (Suno)</b></td><td>Local</td>
            <td>Expressive/emotive, but slow and less controllable — more novelty than production</td></tr>
        <tr><td><b>ElevenLabs</b></td><td>Managed / cloud, streaming</td>
            <td>Best-in-class voice quality + low-latency streaming; industry standard for voice agents</td></tr>
        <tr><td><b>Cartesia (Sonic)</b></td><td>Managed / cloud, streaming</td>
            <td>Built specifically for ultra-low-latency conversational TTS</td></tr>
        <tr><td><b>PlayHT</b></td><td>Managed / cloud</td>
            <td>Another popular streaming TTS API, competitive with ElevenLabs</td></tr>
        <tr><td><b>OpenAI Realtime API (TTS side)</b></td><td>Managed / cloud, streaming</td>
            <td>Same socket as gpt-4o-transcribe; convenient if already using OpenAI</td></tr>
        <tr><td><b>Azure/Google Neural TTS</b></td><td>Managed / cloud</td>
            <td>Solid enterprise options, many voices/languages</td></tr>
      </table>
      <p><b>Our plan:</b> start with <code>Piper</code> locally (Phase 4), later compare
      against <code>ElevenLabs</code> streaming TTS (Phase 13).</p>

      <h3>Why local-first for learning</h3>
      <ul>
        <li>No API cost while iterating constantly during development</li>
        <li>No network latency variable while learning to measure/optimize latency</li>
        <li>Forces understanding of the actual model mechanics rather than "call an API"</li>
        <li>Managed services are then introduced later purely as a <i>trade-off comparison</i>
        (latency, quality, cost, privacy) once the fundamentals are internalized</li>
      </ul>
    `
  }
];

// ---- Rendering logic ----
const navList = document.getElementById('nav-list');
const main = document.getElementById('main');
const searchInput = document.getElementById('search');
const filterBtns = document.querySelectorAll('.filter-btn');
let activeFilter = 'all';

function renderNav() {
  const query = searchInput.value.trim().toLowerCase();
  navList.innerHTML = '';
  const filtered = ENTRIES.filter(e => {
    if (activeFilter !== 'all' && e.type !== activeFilter) return false;
    if (!query) return true;
    return e.title.toLowerCase().includes(query) || e.html.toLowerCase().includes(query);
  });
  document.getElementById('entry-count').textContent = ENTRIES.length;

  if (filtered.length === 0) {
    navList.innerHTML = '<div style="padding:16px;color:var(--muted);font-size:12px;">No matches.</div>';
    return;
  }

  filtered.slice().reverse().forEach(e => {
    const item = document.createElement('div');
    item.className = 'nav-item';
    item.dataset.id = e.id;
    const tagClass = e.type === 'phase' ? 'phase' : 'qa';
    const tagLabel = e.type === 'phase' ? 'PHASE' : 'Q&A';
    item.innerHTML = `
      <span class="tag ${tagClass}">${tagLabel}</span>
      <span class="title">${e.title}</span>
      <span style="font-size:11px;color:var(--muted);">${e.date}</span>
    `;
    item.addEventListener('click', () => selectEntry(e.id));
    navList.appendChild(item);
  });
}

function selectEntry(id) {
  const entry = ENTRIES.find(e => e.id === id);
  if (!entry) return;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.id === id));
  main.innerHTML = `<div class="entry">${entry.html}</div>`;
  main.scrollTop = 0;
  history.replaceState(null, '', '#' + id);
}

searchInput.addEventListener('input', renderNav);
filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderNav();
  });
});

renderNav();

// Deep link support
const hash = location.hash.replace('#', '');
if (hash && ENTRIES.some(e => e.id === hash)) {
  selectEntry(hash);
} else if (ENTRIES.length) {
  selectEntry(ENTRIES[ENTRIES.length - 1].id);
}
</script>
</body>
</html>
